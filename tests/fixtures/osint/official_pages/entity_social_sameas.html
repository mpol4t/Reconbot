<!doctype html>
<html>
  <head>
    <title>Social Example</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Example Entity",
        "sameAs": [
          "https://www.linkedin.com/company/example-entity",
          "https://twitter.com/example",
          "https://www.instagram.com/example",
          "https://www.youtube.com/@example",
          "https://github.com/example",
          "https://www.tiktok.com/@example",
          "https://medium.com/example",
          "https://www.linkedin.com/shareArticle?url=https://example.com",
          "https://twitter.com/intent/tweet?url=https://example.com",
          "https://www.linkedin.com/in/random-person"
        ]
      }
    </script>
  </head>
  <body>
    <a href="https://www.facebook.com/example">Facebook</a>
    <a href="https://www.facebook.com/sharer/sharer.php?u=https://example.com">Share</a>
  </body>
</html>
