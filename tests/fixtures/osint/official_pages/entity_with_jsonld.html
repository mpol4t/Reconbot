<!doctype html>
<html>
  <head>
    <title>Example Entity</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Example Entity",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "500 Market Street",
          "addressLocality": "San Francisco",
          "addressRegion": "CA",
          "postalCode": "94105",
          "addressCountry": "US"
        },
        "contactPoint": {
          "@type": "ContactPoint",
          "contactType": "support",
          "email": "support@example.com",
          "telephone": "+1 555 123 4567",
          "url": "https://example.com/contact"
        }
      }
    </script>
  </head>
  <body>
    <main>Official public entity page.</main>
  </body>
</html>
